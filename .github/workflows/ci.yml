name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
  db-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: aeyes-ci
          POSTGRES_DB: aeyes
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: aeyes-ci
          MYSQL_DATABASE: aeyes
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -paeyes-ci"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      # CI 서비스 컨테이너 전용 임시 비밀번호(비밀 아님).
      AEYES_TEST_PG_URL: postgres://postgres:aeyes-ci@127.0.0.1:5432/aeyes
      AEYES_TEST_MYSQL_URL: mysql://root:aeyes-ci@127.0.0.1:3306/aeyes
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter aeyes-local-agent exec vitest run test/dbIntegration.test.ts
